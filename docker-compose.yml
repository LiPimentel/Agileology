services:
  postgres:
    image: postgres:16-alpine
    container_name: agileology-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agileology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: agileology
    volumes:
      - agileology_db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: agileology-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    # The app never needs extra privileges: drop every Linux capability and forbid gaining more.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Reachable only from this machine by default (a proxy/tunnel such as cloudflared on the same host
      # is enough). For testing over Tailscale/LAN set APP_BIND=0.0.0.0 in .env; never on a public host.
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    volumes:
      # Outside public/ on purpose: Next serves anything under public/ as a plain static file,
      # which would bypass the /uploads route (Range handling, nosniff + sandbox headers).
      # The container runs as uid 1000 ("node"): on Linux, `chown 1000:1000 uploads` once on the host.
      - ./uploads:/app/uploads

volumes:
  agileology_db_data:
